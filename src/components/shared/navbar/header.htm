<!-- =========================
Header
===========================-->
<header class="fixed top-4 left-1/2 z-50 w-[calc(100%-2rem)] max-w-[1440px] -translate-x-1/2">
  <div class="flex items-center justify-between">
    
    <!-- Left: Logo -->
    <div class="flex-shrink-0 rounded-full border border-white/20 bg-white/90 px-6 py-3 shadow-sm backdrop-blur-md">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="sr-only">Urbanland</span>
        <img src="./images/shared/urbanland-logo.png" alt="Urbanland" class="h-8 w-auto" />
      </a>
    </div>

    <!-- Center: Navigation -->
    <nav class="hidden flex-grow justify-center xl:flex">
      <ul class="flex items-center gap-8 rounded-full border border-white/20 bg-white/90 px-8 py-3.5 shadow-sm backdrop-blur-md">
        <li class="nav-item relative cursor-pointer" data-menu="company-mega-menu-v2">
          <a href="#" class="font-inter text-sm font-medium tracking-wide text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70">About</a>
          <Component src="src/components/shared/navbar/company-menu.htm" />
        </li>
        <li class="nav-item relative cursor-pointer" data-menu="product-mega-menu">
          <a href="#" class="font-inter text-sm font-medium tracking-wide text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70">Products</a>
          <Component src="src/components/shared/navbar/plan-and-support-menu.htm" />
        </li>
        <li class="nav-item relative cursor-pointer">
          <a href="#" class="font-inter text-sm font-medium tracking-wide text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70">Spaces</a>
        </li>
        <li class="nav-item relative cursor-pointer">
          <a href="#" class="font-inter text-sm font-medium tracking-wide text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70">Collabs</a>
        </li>
        <li class="nav-item relative cursor-pointer" data-menu="resources-dropdown-menu-v2">
          <a href="#" class="font-inter text-sm font-medium tracking-wide text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70">Stories</a>
          <Component src="src/components/shared/navbar/resources-menu.htm" />
        </li>
        <li class="nav-item relative cursor-pointer">
          <a href="./contact.html" class="font-inter text-sm font-medium tracking-wide text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70">Contact</a>
        </li>
      </ul>
    </nav>

    <!-- Right: Icons -->
    <div class="flex items-center gap-6 rounded-full border border-white/20 bg-white/90 px-6 py-3.5 shadow-sm backdrop-blur-md">
      <button class="text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
      </button>
      <button class="text-[#1A1A1A] transition-colors hover:text-[#1A1A1A]/70" aria-label="Account">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
      
      <!-- Mobile Hamburger -->
      <div class="block xl:hidden">
        <button class="nav-hamburger flex flex-col gap-1.5" aria-label="Menu">
          <span class="block h-0.5 w-6 bg-[#1A1A1A]"></span>
          <span class="block h-0.5 w-6 bg-[#1A1A1A]"></span>
          <span class="block h-0.5 w-6 bg-[#1A1A1A]"></span>
        </button>
      </div>
    </div>
  </div>
  <Component src="src/components/shared/mobile-menu.htm" />
</header>
