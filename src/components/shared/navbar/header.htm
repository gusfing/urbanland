<!-- =========================
Header
===========================-->
<header id="site-header" class="fixed top-4 left-1/2 z-50 w-[calc(100%-2rem)] max-w-[1440px] -translate-x-1/2 transition-all duration-300">
  <div id="header-container" class="flex items-center justify-between rounded-[9px] border border-white/20 bg-white/10 px-6 py-3 shadow-[0_8px_32px_rgba(0,0,0,0.1)] backdrop-blur-xl transition-all duration-300 hover:bg-white/20">
    
    <!-- Left: Logo -->
    <div class="flex-shrink-0">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="sr-only">Urbanland</span>
        <!-- using brightness-0 invert to make logo white initially on dark hero -->
        <img id="header-logo" src="./images/shared/urbanland-logo.png" alt="Urbanland" class="h-8 w-auto transition-all duration-300 hover:scale-[1.02] brightness-0 invert" />
      </a>
    </div>

    <!-- Center: Navigation -->
    <nav class="hidden flex-grow justify-center xl:flex">
      <ul class="flex items-center gap-8">
        <li class="nav-item relative cursor-pointer group" data-menu="product-mega-menu">
          <a href="./products.html" class="nav-link font-inter text-sm font-medium tracking-wide text-white transition-colors group-hover:text-[#E8611A]">Products</a>
          <Component src="src/components/shared/navbar/plan-and-support-menu.htm" />
        </li>
        <li class="nav-item relative cursor-pointer group">
          <a href="./solutions.html" class="nav-link font-inter text-sm font-medium tracking-wide text-white transition-colors group-hover:text-[#E8611A]">Solutions</a>
        </li>
        <li class="nav-item relative cursor-pointer group">
          <a href="./case-studies.html" class="nav-link font-inter text-sm font-medium tracking-wide text-white transition-colors group-hover:text-[#E8611A]">Projects</a>
        </li>
        <li class="nav-item relative cursor-pointer group" data-menu="company-mega-menu-v2">
          <a href="./about.html" class="nav-link font-inter text-sm font-medium tracking-wide text-white transition-colors group-hover:text-[#E8611A]">About Us</a>
          <Component src="src/components/shared/navbar/company-menu.htm" />
        </li>
        <li class="nav-item relative cursor-pointer group">
          <a href="./contact.html" class="nav-link font-inter text-sm font-medium tracking-wide text-white transition-colors group-hover:text-[#E8611A]">Contact</a>
        </li>
      </ul>
    </nav>

    <!-- Right: CTA + Hamburger -->
    <div class="flex items-center gap-4">
      <!-- Get Quote CTA (standalone floating button on desktop) -->
      <a
        href="./contact.html"
        id="nav-cta-quote"
        class="hidden xl:inline-flex items-center gap-2 rounded-[9px] bg-[#E8611A] px-5 py-2.5 font-inter text-sm font-semibold text-white transition-all hover:bg-[#c9511a] hover:shadow-[0_8px_24px_rgba(232,97,26,0.3)] hover:scale-[1.02]"
      >
        Get Project Quote
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
      </a>
      
      <!-- Mobile Hamburger Button -->
      <div class="block xl:hidden">
        <button class="nav-hamburger flex flex-col justify-between h-[14px] w-[20px] cursor-pointer group" aria-label="Menu">
          <span class="hamburger-line block h-[1.5px] w-full bg-white transition-all duration-300"></span>
          <span class="hamburger-line block h-[1.5px] w-[14px] bg-white transition-all duration-300 ml-auto group-hover:w-full"></span>
          <span class="hamburger-line block h-[1.5px] w-full bg-white transition-all duration-300"></span>
        </button>
      </div>
    </div>
  </div>
  <Component src="src/components/shared/mobile-menu.htm" />
</header>

<script>
  (function() {
    const container = document.getElementById('header-container');
    const logo = document.getElementById('header-logo');
    const navLinks = document.querySelectorAll('.nav-link');
    const hamburgerLines = document.querySelectorAll('.hamburger-line');
    
    function updateHeaderState() {
      if (window.scrollY > 50) {
        // Scrolled state - solid white
        container.classList.remove('bg-white/10', 'border-white/20', 'hover:bg-white/20');
        container.classList.add('bg-white/95', 'border-[#1A1A1A]/10', 'shadow-md');
        
        logo.classList.remove('brightness-0', 'invert');
        
        navLinks.forEach(link => {
          link.classList.remove('text-white');
          link.classList.add('text-[#1A1A1A]');
        });
        
        hamburgerLines.forEach(line => {
          line.classList.remove('bg-white');
          line.classList.add('bg-[#1A1A1A]');
        });
      } else {
        // Top state - transparent/glassy
        container.classList.add('bg-white/10', 'border-white/20', 'hover:bg-white/20');
        container.classList.remove('bg-white/95', 'border-[#1A1A1A]/10', 'shadow-md');
        
        logo.classList.add('brightness-0', 'invert');
        
        navLinks.forEach(link => {
          link.classList.add('text-white');
          link.classList.remove('text-[#1A1A1A]');
        });
        
        hamburgerLines.forEach(line => {
          line.classList.add('bg-white');
          line.classList.remove('bg-[#1A1A1A]');
        });
      }
    }
    
    window.addEventListener('scroll', updateHeaderState, { passive: true });
    // Run once on load to set initial state correctly
    updateHeaderState();
  })();
</script>
