<!-- =========================
Header
===========================-->
<header id="site-header" class="fixed top-4 left-1/2 z-[999] w-[calc(100%-2rem)] max-w-[1440px] -translate-x-1/2 transition-all duration-300">
  <div id="header-container" class="relative flex items-center justify-between rounded-[9px] border border-[#1A1A1A]/10 bg-white/95 px-4 py-3 sm:px-6 shadow-md backdrop-blur-xl transition-all duration-300">
    
    <!-- Left: Logo -->
    <div class="flex items-center">
      <a href="./index.html" class="flex items-center">
        <span class="sr-only">Urbanland</span>
        <img id="header-logo" src="./images/shared/urbanland-logo.png" alt="Urbanland" class="h-6 sm:h-8 w-auto transition-all duration-300 hover:scale-[1.02]" />
      </a>
    </div>

    <!-- Center: Brand Icon (Absolutely Centered) -->
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex items-center justify-center">
      <img id="center-brand-icon" src="./images/shared/center-icon.png" alt="Urbanland Icon" class="h-6 sm:h-8 w-auto pointer-events-auto transition-all duration-300 hover:scale-[1.05]" />
    </div>

    <!-- Right: Menu Button -->
    <div class="flex items-center">
      <button class="nav-hamburger flex items-center gap-1.5 cursor-pointer font-inter text-[11px] font-semibold uppercase tracking-[0.25em] text-[#1A1A1A] transition-all duration-300 hover:opacity-75" id="hamburger-btn" aria-label="Menu">
        <span class="text-sm font-light leading-none" id="hamburger-plus">+</span>
        <span class="leading-none">Menu</span>
      </button>
    </div>
    
  </div>
</header>
<Component src="src/components/shared/mobile-menu.htm" />
