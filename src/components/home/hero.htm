  <!-- Navigation Cluster (Dots only) -->
  <div class="absolute bottom-10 right-10 z-30 flex items-center gap-6">
    <!-- dot indicators -->
    <div id="hero-dots" class="flex gap-2.5" role="tablist" aria-label="Slide indicators">
      <button class="hero-dot size-2.5 rounded-full bg-white transition-all duration-300" role="tab" aria-selected="true"  aria-label="Slide 1"></button>
      <button class="hero-dot size-2.5 rounded-full bg-white/40 transition-all duration-300" role="tab" aria-selected="false" aria-label="Slide 2"></button>
      <button class="hero-dot size-2.5 rounded-full bg-white/40 transition-all duration-300" role="tab" aria-selected="false" aria-label="Slide 3"></button>
      <button class="hero-dot size-2.5 rounded-full bg-white/40 transition-all duration-300" role="tab" aria-selected="false" aria-label="Slide 4"></button>
      <button class="hero-dot size-2.5 rounded-full bg-white/40 transition-all duration-300" role="tab" aria-selected="false" aria-label="Slide 5"></button>

    </div>
  </div>
</section>

<script>
  (function () {
    const track   = document.getElementById('hero-slides');
    const slides  = document.querySelectorAll('.hero-slide');
    const dots    = document.querySelectorAll('.hero-dot');
    const total   = slides.length;
    let current   = 0;
    let timer;

    function goTo(index) {
      slides[current].setAttribute('aria-hidden', 'true');
      dots[current].classList.replace('bg-white', 'bg-white/40');
      dots[current].setAttribute('aria-selected', 'false');

      current = (index + total) % total;

      track.style.transform = `translateX(-${current * 100}%)`;
      slides[current].setAttribute('aria-hidden', 'false');
      dots[current].classList.replace('bg-white/40', 'bg-white');
      dots[current].setAttribute('aria-selected', 'true');
    }

    function startAuto() {
      clearInterval(timer);
      timer = setInterval(() => goTo(current + 1), 5000);
    }

    dots.forEach((dot, i) => dot.addEventListener('click', () => { goTo(i); startAuto(); }));

    // keyboard support
    document.getElementById('hero-slider').addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  { goTo(current - 1); startAuto(); }
      if (e.key === 'ArrowRight') { goTo(current + 1); startAuto(); }
    });

    // touch / swipe support
    let touchStartX = 0;
    track.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) { goTo(diff > 0 ? current + 1 : current - 1); startAuto(); }
    }, { passive: true });

    startAuto();
  })();
</script>
