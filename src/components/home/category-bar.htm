<!-- category bar section -->
<section
  class="w-full border-b border-gray-200 bg-white"
  aria-label="Product categories"
>
  <div class="relative flex items-center">

    <!-- left arrow -->
    <button
      id="cat-prev"
      class="absolute left-2 z-10 flex size-11 shrink-0 items-center justify-center rounded-full bg-gray-900 text-white shadow-md transition hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-900"
      aria-label="Scroll categories left"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <!-- scrollable track -->
    <div
      id="cat-track"
      class="flex items-center gap-3 overflow-x-auto scroll-smooth px-16 py-5"
      style="scrollbar-width: none; -ms-overflow-style: none;"
      role="list"
      aria-label="Category list"
    >

      <!-- 1. Wicker -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Wicker">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9"/><path d="M12 3v6"/><path d="M5 9v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="m9 9 3 11 3-11"/></svg>
        Wicker
      </button>

      <!-- 2. Shelters -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Shelters">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M3 7v1a3 3 0 0 0 6 0V7"/><path d="M9 7v1a3 3 0 0 0 6 0V7"/><path d="M15 7v1a3 3 0 0 0 6 0V7"/><path d="M4 21V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v17"/></svg>
        Shelters
      </button>

      <!-- 3. Planter -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Planter">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a4 4 0 0 0-4-4H4v4a4 4 0 0 0 4 4h4Z"/><path d="M12 14a4 4 0 0 1 4 4v4h-4a4 4 0 0 1-4-4v-4Z"/><path d="M12 14a4 4 0 0 1 4-4h4v4a4 4 0 0 1-4 4h-4Z"/><path d="M12 10a4 4 0 0 0-4 4v4H4v-4a4 4 0 0 0 4-4h4Z"/></svg>
        Planter
      </button>

      <!-- 4. Dustbin -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Dustbin">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        Dustbin
      </button>

      <!-- 5. Cabanas -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Cabanas">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 9v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M9 22V12h6v10"/></svg>
        Cabanas
      </button>

      <!-- 6. Benches -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Benches">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M6 12v6"/><path d="M18 12v6"/><path d="M4 18h4"/><path d="M16 18h4"/><path d="M6 8v4"/><path d="M18 8v4"/></svg>
        Benches
      </button>

      <!-- 7. Cone furniture -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Cone furniture">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 20h18Z"/><path d="M12 22v-2"/></svg>
        Cone furniture
      </button>

      <!-- 8. Sheds -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Sheds">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M3 7v1a3 3 0 0 0 6 0V7"/><path d="M9 7v1a3 3 0 0 0 6 0V7"/><path d="M15 7v1a3 3 0 0 0 6 0V7"/><path d="M4 21V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v17"/></svg>
        Sheds
      </button>

      <!-- 9. Car sheds -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Car sheds">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11"/><path d="M19 18h2a2 2 0 0 0 2-2v-2l-3-4-3-1h-3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        Car sheds
      </button>

      <!-- 10. Pool -->
      <button class="cat-item flex shrink-0 items-center gap-3 rounded-full border border-gray-200 bg-gray-50 px-6 py-3 text-base font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" role="listitem" aria-label="Pool">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1C5.8 7 7 6 7 6s1.2-1 2.5-1c1.3 0 2.5 1 2.5 1s1.2 1 2.5 1c1.3 0 2.5-1 2.5-1s1.2-1 2.5-1c1.3 0 2.5 1 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 1.3 0 2.5-1 2.5-1s1.2-1 2.5-1c1.3 0 2.5 1 2.5 1s1.2 1 2.5 1c1.3 0 2.5-1 2.5-1s1.2-1 2.5-1c1.3 0 2.5 1 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 1.3 0 2.5-1 2.5-1s1.2-1 2.5-1c1.3 0 2.5 1 2.5 1s1.2 1 2.5 1c1.3 0 2.5-1 2.5-1s1.2-1 2.5-1c1.3 0 2.5 1 2.5 1"/></svg>
        Pool
      </button>

    </div>

    <!-- right arrow -->
    <button
      id="cat-next"
      class="absolute right-2 z-10 flex size-11 shrink-0 items-center justify-center rounded-full bg-gray-900 text-white shadow-md transition hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-900"
      aria-label="Scroll categories right"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

  </div>
</section>

<style>
  #cat-track::-webkit-scrollbar { display: none; }
</style>

<script>
  (function () {
    const track   = document.getElementById('cat-track');
    const btnPrev = document.getElementById('cat-prev');
    const btnNext = document.getElementById('cat-next');
    if (!track) return;

    const STEP = 300;

    btnNext.addEventListener('click', () => {
      const maxScroll = track.scrollWidth - track.clientWidth;
      if (track.scrollLeft >= maxScroll - 4) {
        track.scrollTo({ left: 0, behavior: 'smooth' });
      } else {
        track.scrollBy({ left: STEP, behavior: 'smooth' });
      }
    });

    btnPrev.addEventListener('click', () => {
      if (track.scrollLeft <= 4) {
        track.scrollTo({ left: track.scrollWidth, behavior: 'smooth' });
      } else {
        track.scrollBy({ left: -STEP, behavior: 'smooth' });
      }
    });

    // drag-to-scroll (mouse)
    let isDown = false, startX, scrollLeft;
    track.addEventListener('mousedown', (e) => {
      isDown = true;
      startX = e.pageX - track.offsetLeft;
      scrollLeft = track.scrollLeft;
      track.style.cursor = 'grabbing';
    });
    track.addEventListener('mouseleave', () => { isDown = false; track.style.cursor = ''; });
    track.addEventListener('mouseup',    () => { isDown = false; track.style.cursor = ''; });
    track.addEventListener('mousemove',  (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - track.offsetLeft;
      track.scrollLeft = scrollLeft - (x - startX);
    });
  })();
</script>
